<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Travel Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --primary: #0ea5a4;
    --primary-dark: #0b8685;
    --accent: #f97316;
    --bg-1: #0f172a;
    --bg-2: #134e4a;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --bubble-assistant: #f0fdfa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', Arial, sans-serif;
    margin: 0;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, var(--primary), #0d9488 60%, var(--accent));
    color: #fff;
    padding: 26px 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: "";
    position: absolute;
    top: -30px; right: -30px;
    width: 130px; height: 130px;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: -40px; left: -20px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .header h1 {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    font-size: 21px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: rgba(255,255,255,0.9);
    position: relative;
    z-index: 1;
  }

  .chat {
    height: 440px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #fafcfb;
  }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg .who {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 10px rgba(14,165,164,0.25);
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--text);
    border: 1px solid #d7f2ee;
    border-bottom-left-radius: 4px;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bubble-assistant);
    border: 1px solid #d7f2ee;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    opacity: 0.4;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 20px 16px;
    background: #fafcfb;
  }
  .suggestions button {
    border: 1px solid #d7f2ee;
    background: #fff;
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .suggestions button:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .composer {
    display: flex;
    gap: 8px;
    padding: 14px 18px 18px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  .composer input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 14px;
    font-family: inherit;
    background: #f8fafc;
  }
  .composer input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  .composer button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s ease;
  }
  .composer button:hover { transform: scale(1.05); }
  .composer button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }
  .composer button svg { width: 18px; height: 18px; }

  .error {
    color: #dc2626;
    font-size: 12.5px;
    text-align: center;
    padding: 0 18px 8px;
    background: #fff;
  }
  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 0 18px 16px;
    background: #fff;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>✈️ AI Travel Chatbot</h1>
    <p>Your companion for destinations, itineraries & budgets</p>
  </div>

  <div class="chat" id="chat">
    <div class="msg assistant">
      <span class="who">Assistant</span>
      Hi there! Where would you like to go? Ask me for destination ideas, a full itinerary, or budget tips.
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button data-prompt="Plan a 5-day budget trip to Bali">5-day Bali plan</button>
    <button data-prompt="Suggest 3 places to visit in Europe in spring">Spring in Europe</button>
    <button data-prompt="Give me solo travel safety tips">Solo travel tips</button>
    <button data-prompt="Suggest a weekend trip under $300">Budget weekend</button>
  </div>

  <div class="composer">
    <input type="text" id="userInput" placeholder="Ask about your trip..." />
    <button id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
  <div class="error" id="errorMsg"></div>
  <div class="footnote">Powered by Claude</div>
</div>

<script>
const chat = document.getElementById('chat');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const errorMsg = document.getElementById('errorMsg');
const suggestions = document.getElementById('suggestions');

let history = [];

const SYSTEM_PROMPT = "You are a friendly and knowledgeable AI travel assistant. Help users plan trips: suggest destinations, build day-wise itineraries, estimate budgets, and give packing and safety tips. Be specific and practical, use bullet points where helpful, and keep responses concise. Reply in the same language the user writes in.";

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<span class="who">' + (role === 'user' ? 'You' : 'Assistant') + '</span>';
  const span = document.createElement('span');
  span.textContent = text;
  div.appendChild(span);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage(text) {
  errorMsg.textContent = '';

  if (!text || !text.trim()) return;

  if (suggestions) {
    suggestions.remove();
  }

  addMessage('user', text);

  history.push({
    role: 'user',
    content: text
  });

  userInput.value = '';
  sendBtn.disabled = true;
  showTyping();

  try {
    const response = await fetch(
      'https://ai-travel-chatbot.shrutikabawane20.workers.dev',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          messages: history
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        'Request failed'
      );
    }

    const reply = data.reply || 'No response received.';

    hideTyping();

    addMessage('assistant', reply);

    history.push({
      role: 'assistant',
      content: reply
    });

  } catch (err) {
    hideTyping();

    console.error('Chat error:', err);

    errorMsg.textContent = err.message;

  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}
// Send button click
sendBtn.addEventListener('click', () => {
  sendMessage(userInput.value);
});

// Press Enter to send
userInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    sendMessage(userInput.value);
  }
});

// Suggestion buttons
document.querySelectorAll('.suggestions button').forEach(button => {
  button.addEventListener('click', () => {
    sendMessage(button.dataset.prompt);
  });
});
</script>
</body>
</html>
